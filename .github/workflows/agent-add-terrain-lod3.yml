name: Add terrain LOD3

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  add-lod3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Extend terrain LOD streamer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return result

          header_path = Path('Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h')
          header = header_path.read_text(encoding='utf-8')

          header = sub1(
              header,
              r'(\s*UPROPERTY\(EditAnywhere, BlueprintReadWrite, Category = "Cubus\|Terrain LOD\|LOD2", meta = \(ClampMin = "0", ClampMax = "4"\)\)\s*\n\s*int32 Lod2VerticalRadiusTiles = 0;\s*\n)',
              r'''\1
    /** LOD3 samples one point every sixty-four canonical voxels. */
    UPROPERTY(EditAnywhere, BlueprintReadWrite, Category = "Cubus|Terrain LOD|LOD3", meta = (ClampMin = "16", ClampMax = "256"))
    int32 Lod3CanonicalVoxelStride = 64;

    /** Number of LOD3 tiles allowed to overlap the outer edge of LOD2. */
    UPROPERTY(EditAnywhere, BlueprintReadWrite, Category = "Cubus|Terrain LOD|LOD3", meta = (ClampMin = "0", ClampMax = "2"))
    int32 Lod3OverlapTiles = 1;

    UPROPERTY(EditAnywhere, BlueprintReadWrite, Category = "Cubus|Terrain LOD|LOD3", meta = (ClampMin = "1", ClampMax = "32"))
    int32 Lod3OuterRadiusTiles = 4;

    UPROPERTY(EditAnywhere, BlueprintReadWrite, Category = "Cubus|Terrain LOD|LOD3", meta = (ClampMin = "0", ClampMax = "4"))
    int32 Lod3VerticalRadiusTiles = 0;
''',
              'header LOD3 settings'
          )

          header = sub1(
              header,
              r'(\s*FCubusTerrainLodTierRuntime Lod2Runtime;\s*\n)',
              r'\1    FCubusTerrainLodTierRuntime Lod3Runtime;\n',
              'header LOD3 runtime'
          )

          header_path.write_text(header, encoding='utf-8')

          cpp_path = Path('Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp')
          cpp = cpp_path.read_text(encoding='utf-8')

          cpp = sub1(
              cpp,
              r'(\s*Lod2Runtime\.LodLevel = 2;\s*\n)',
              r'\1    Lod3Runtime.LodLevel = 3;\n',
              'constructor LOD3 level'
          )

          # Add LOD3 to aggregate diagnostics without changing per-tier mechanics.
          cpp = sub1(
              cpp,
              r'(LoadedLodTileCount\s*=\s*\n\s*Lod1Runtime\.TileComponents\.Num\(\)\s*\+\s*\n\s*Lod2Runtime\.TileComponents\.Num\(\))\s*;',
              r'\1 +\n        Lod3Runtime.TileComponents.Num();',
              'loaded diagnostics'
          )
          cpp = sub1(
              cpp,
              r'(BuildingLodTileCount\s*=\s*\n\s*Lod1Runtime\.ActiveBuilds\.Num\(\)\s*\+\s*\n\s*Lod2Runtime\.ActiveBuilds\.Num\(\))\s*;',
              r'\1 +\n        Lod3Runtime.ActiveBuilds.Num();',
              'building diagnostics'
          )
          cpp = sub1(
              cpp,
              r'(PendingLodTileCount\s*=\s*\n\s*Lod1Runtime\.PendingTiles\.Num\(\)\s*\+\s*\n\s*Lod2Runtime\.PendingTiles\.Num\(\))\s*;',
              r'\1 +\n        Lod3Runtime.PendingTiles.Num();',
              'pending diagnostics'
          )

          update_start = cpp.index('void ACubusTerrainLodWorldActor::UpdateStreaming()')
          update_end = cpp.index('void ACubusTerrainLodWorldActor::UpdateTierStreaming(', update_start)
          update = cpp[update_start:update_end]

          update = sub1(
              update,
              r'(const int32 SafeLod2Stride\s*=\s*\n\s*FMath::Clamp\(\s*\n\s*Lod2CanonicalVoxelStride,\s*\n\s*SafeLod1Stride \+ 1,\s*\n\s*)256(\s*\n\s*\);)',
              r'\g<1>255\2',
              'reserve stride 256 for LOD3'
          )

          lod2_call = re.search(
              r'\s*UpdateTierStreaming\(\s*\n\s*Lod2Runtime,.*?Lod2VerticalRadiusTiles\s*\n\s*\);',
              update,
              flags=re.S
          )
          if not lod2_call:
              raise RuntimeError('LOD2 streaming call not found')

          lod3_block = '''

    const int32 SafeLod2OuterRadius =
        FMath::Max(
            Lod2Runtime.InnerRadiusTiles + 1,
            Lod2Runtime.OuterRadiusTiles
        );

    const double Lod2HalfExtentCanonicalChunks =
        (
            static_cast<double>(SafeLod2OuterRadius) +
            0.5
        ) *
        static_cast<double>(SafeLod2Stride);

    const int32 SafeLod3Stride =
        FMath::Clamp(
            Lod3CanonicalVoxelStride,
            SafeLod2Stride + 1,
            256
        );

    UpdateTierStreaming(
        Lod3Runtime,
        StreamingGridLocation,
        CanonicalChunkWorldSize,
        Lod2HalfExtentCanonicalChunks,
        SafeLod3Stride,
        Lod3OverlapTiles,
        Lod3OuterRadiusTiles,
        Lod3VerticalRadiusTiles
    );'''
          insert_at = lod2_call.end()
          update = update[:insert_at] + lod3_block + update[insert_at:]
          cpp = cpp[:update_start] + update + cpp[update_end:]

          collect_start = cpp.index('void ACubusTerrainLodWorldActor::CollectCompletedBuilds()')
          collect_end = cpp.index('void ACubusTerrainLodWorldActor::CollectCompletedBuildsForTier(', collect_start)
          collect = cpp[collect_start:collect_end]
          collect = sub1(
              collect,
              r'(\s*CollectCompletedBuildsForTier\(Lod2Runtime\);\s*\n)',
              r'\1    CollectCompletedBuildsForTier(Lod3Runtime);\n',
              'collect LOD3'
          )
          cpp = cpp[:collect_start] + collect + cpp[collect_end:]

          start_start = cpp.index('void ACubusTerrainLodWorldActor::StartPendingBuilds()')
          start_end = cpp.index('void ACubusTerrainLodWorldActor::UploadCompletedBuilds()', start_start)
          start = cpp[start_start:start_end]
          start = sub1(
              start,
              r'(Lod1Runtime\.PendingTiles\.IsEmpty\(\)\s*&&\s*\n\s*Lod2Runtime\.PendingTiles\.IsEmpty\(\))',
              r'\1 &&\n        Lod3Runtime.PendingTiles.IsEmpty()',
              'pending LOD3 condition'
          )
          start = sub1(
              start,
              r'(Lod1Runtime\.ActiveBuilds\.Num\(\)\s*\+\s*\n\s*Lod2Runtime\.ActiveBuilds\.Num\(\))\s*;',
              r'\1 +\n            Lod3Runtime.ActiveBuilds.Num();',
              'shared active build budget'
          )
          start = sub1(
              start,
              r'(else if \(!Lod2Runtime\.PendingTiles\.IsEmpty\(\)\)\s*\{\s*Tier = &Lod2Runtime;\s*\})',
              r'''\1
        else if (!Lod3Runtime.PendingTiles.IsEmpty())
        {
            Tier = &Lod3Runtime;
        }''',
              'LOD3 build priority',
              flags=re.S
          )
          cpp = cpp[:start_start] + start + cpp[start_end:]

          upload_start = cpp.index('void ACubusTerrainLodWorldActor::UploadCompletedBuilds()')
          upload_end = cpp.index('bool ACubusTerrainLodWorldActor::UploadOneCompletedBuild(', upload_start)
          upload = cpp[upload_start:upload_end]
          upload = sub1(
              upload,
              r'(Lod1Runtime\.CompletedBuilds\.IsEmpty\(\)\s*&&\s*\n\s*Lod2Runtime\.CompletedBuilds\.IsEmpty\(\))',
              r'\1 &&\n        Lod3Runtime.CompletedBuilds.IsEmpty()',
              'completed LOD3 condition'
          )
          upload = sub1(
              upload,
              r'(else if \(!Lod2Runtime\.CompletedBuilds\.IsEmpty\(\)\)\s*\{\s*bUploaded = UploadOneCompletedBuild\(\s*Lod2Runtime,\s*CanonicalVoxelSize,\s*TerrainMaterial,\s*WorkerMillisecondsThisTick\s*\);\s*\})',
              r'''\1
        else if (!Lod3Runtime.CompletedBuilds.IsEmpty())
        {
            bUploaded = UploadOneCompletedBuild(
                Lod3Runtime,
                CanonicalVoxelSize,
                TerrainMaterial,
                WorkerMillisecondsThisTick
            );
        }''',
              'LOD3 upload priority',
              flags=re.S
          )
          upload = sub1(
              upload,
              r'(\s*RetireStaleTilesIfResident\(Lod2Runtime\);\s*\n)',
              r'\1    RetireStaleTilesIfResident(Lod3Runtime);\n',
              'LOD3 make-before-break retirement'
          )
          cpp = cpp[:upload_start] + upload + cpp[upload_end:]

          clear_start = cpp.index('void ACubusTerrainLodWorldActor::ClearAllTiles()')
          clear_end = cpp.index('void ACubusTerrainLodWorldActor::ClearTier(', clear_start)
          clear = cpp[clear_start:clear_end]
          clear = sub1(
              clear,
              r'(\s*ClearTier\(Lod2Runtime\);\s*\n)',
              r'\1    ClearTier(Lod3Runtime);\n',
              'clear LOD3'
          )
          cpp = cpp[:clear_start] + clear + cpp[clear_end:]

          cpp_path.write_text(cpp, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n "Lod3CanonicalVoxelStride = 64" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h
          grep -n "Lod3Runtime.LodLevel = 3" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -n "Lod3Runtime" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp | head -20
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git commit -m "Add terrain LOD3 horizon tier"
          git push origin HEAD:agent/density-meshing
