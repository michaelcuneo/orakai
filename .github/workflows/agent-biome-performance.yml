                  static constexpr uint32 CurrentGenerationVersion = 17;
              '''
          )

          # Regression coverage for exact standalone climate and cached density sampling.
          tests = Path('Source/Orakai/CubusCore/Tests/CubusBiomeFieldTests.cpp')
          text = tests.read_text(encoding='utf-8')
          insert = textwrap.dedent('''
          IMPLEMENT_SIMPLE_AUTOMATION_TEST(
              FCubusBiomePreparedClimateTest,
              "Orakai.Cubus.Generation.BiomePreparedClimate",
              EAutomationTestFlags::EditorContext | EAutomationTestFlags::EngineFilter
          )

          bool FCubusBiomePreparedClimateTest::RunTest(const FString& Parameters)
          {
              (void)Parameters;

              FCubusBiomeFieldSettings Settings;
              Settings.bEnabled = true;
              Settings.BiomeOffsetX = 1387;
              Settings.BiomeOffsetY = -2911;

              FCubusBiomeTerrainContext Terrain;
              Terrain.bHasTerrainFormSample = true;
              Terrain.TerrainFormSample = FCubusTerrainForm::Sample(120.0f, -75.0f, Settings.HydrologySettings.TerrainFormSettings);
              Terrain.Gradient = FVector2D(0.12f, -0.08f);

              const FCubusBiomeClimateContext Climate = FCubusBiomeField::SampleClimate(120.0f, -75.0f, Settings);
              const FCubusBiomeSample Prepared = FCubusBiomeField::Sample(120.0f, -75.0f, 16.0f, 0.25f, Settings, Terrain, &Climate);
              const FCubusBiomeSample Repeated = FCubusBiomeField::Sample(120.0f, -75.0f, 16.0f, 0.25f, Settings, Terrain, &Climate);

              TestEqual(TEXT("Prepared climate is deterministic"), Prepared.Moisture, Repeated.Moisture);
              TestEqual(TEXT("Prepared climate keeps biome identity deterministic"), Prepared.BiomeName, Repeated.BiomeName);

              const FCubusBiomeClimateContext A = FCubusBiomeField::SampleClimate(120.0f, -75.0f, Settings);
              const FCubusBiomeClimateContext B = FCubusBiomeField::SampleClimate(124.0f, -75.0f, Settings);
              const FCubusBiomeClimateContext Mid = FCubusBiomeField::LerpClimate(A, B, 0.5f);
              TestTrue(TEXT("Climate interpolation stays between neighbouring moisture samples"),
                  Mid.ProvinceMoisture >= FMath::Min(A.ProvinceMoisture, B.ProvinceMoisture) &&
                  Mid.ProvinceMoisture <= FMath::Max(A.ProvinceMoisture, B.ProvinceMoisture));
              TestTrue(TEXT("Climate interpolation keeps parent material normalized"), Mid.ParentMaterial >= 0.0f && Mid.ParentMaterial <= 1.0f);
              return true;
          }

          ''')
          marker = 'IMPLEMENT_SIMPLE_AUTOMATION_TEST(\n    FCubusBiomeEcologicalNicheTest,'
          if 'FCubusBiomePreparedClimateTest' not in text:
              if marker not in text:
                  raise RuntimeError('missing biome test insertion marker')
              text = text.replace(marker, insert + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY

