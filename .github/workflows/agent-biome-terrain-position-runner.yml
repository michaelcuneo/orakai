name: Apply biome terrain position ecology
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Execute corrected ecology payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path('.github/workflows/agent-biome-terrain-position.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = payload.index(marker) + len(marker)
          script = textwrap.dedent(payload[start:])

          old = "'''                RangeSuitability(Result.OrganicMatter, Definition.MinimumOrganicMatter, Definition.MaximumOrganicMatter, Softness) *\\n                RangeSuitability(Result.Erosion, Definition.MinimumErosion, Definition.MaximumErosion, Softness);\\n''',"
          new = "'''  RangeSuitability(Result.OrganicMatter, Definition.MinimumOrganicMatter, Definition.MaximumOrganicMatter, Softness) *\\n      RangeSuitability(Result.Erosion, Definition.MinimumErosion, Definition.MaximumErosion, Softness);\\n''',"
          if old not in script:
              raise RuntimeError('authored definition indentation anchor not found in payload')
          script = script.replace(old, new, 1)
          Path('/tmp/apply-biome-terrain-position.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-biome-terrain-position.sh
