name: Apply biome ecology v2 core
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Execute biome v2 payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/agent-biomes-v2-core.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in source:
              raise RuntimeError('biome v2 payload marker not found')

          body = source.split(marker, 1)[1]
          dedented = []
          for line in body.splitlines():
              dedented.append(line[10:] if line.startswith('          ') else line)

          script = Path('/tmp/apply-biomes-v2.sh')
          script.write_text('\n'.join(dedented) + '\n', encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)
          PY
