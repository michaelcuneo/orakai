name: Apply density disk cache v2
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Execute density cache payload with exact dedent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          payload = Path('.github/workflows/agent-density-disk-cache.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = payload.index(marker) + len(marker)
          prefix = '          '
          lines = payload[start:].splitlines(True)
          script = ''.join(line[len(prefix):] if line.startswith(prefix) else line for line in lines)
          Path('/tmp/apply-density-cache.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-density-cache.sh
