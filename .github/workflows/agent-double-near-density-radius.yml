name: Agent double near density radius

on:
  push:
    branches:
      - agent/density-meshing
    paths:
      - .github/agent/double_near_density_radius.py
      - .github/workflows/agent-double-near-density-radius.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply near density radius change
        run: python .github/agent/double_near_density_radius.py
      - name: Verify scope
        run: |
          git diff --check
          git diff -- Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
      - name: Commit changes
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Double near density LOD radius'
          git push origin HEAD:agent/density-meshing
