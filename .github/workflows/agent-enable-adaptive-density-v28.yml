name: Enable adaptive density v28
on:
  workflow_dispatch:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/enable_adaptive_density_v28.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply adaptive density migration
        run: python3 .github/agent/enable_adaptive_density_v28.py
      - name: Verify source diff
        run: |
          git diff --check
          git diff --exit-code -- Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git diff -- Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h Source/Orakai/CubusCore/Tests/CubusDensityLodTests.cpp
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h Source/Orakai/CubusCore/Tests/CubusDensityLodTests.cpp
          git commit -m 'Re-enable adaptive density near-field sampling'
          git push origin HEAD:agent/density-meshing
