name: Enhance density geomorphology v27
on:
  workflow_dispatch:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/enhance_density_geomorphology_v27.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 .github/agent/enhance_density_geomorphology_v27.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
          if git diff --name-only | grep -q 'CubusTerrainLodWorldActor.cpp'; then
            echo 'LOD actor changed unexpectedly'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
          git commit -m 'Add structured erosion and rock detail to density terrain'
          git push origin HEAD:agent/density-meshing
