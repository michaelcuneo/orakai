name: Agent finalize physical scale v30

on:
  push:
    branches: [agent/density-meshing]
    paths:
      - .github/agent/finalize_physical_scale_v30.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply biome and validation fixes
        run: python .github/agent/finalize_physical_scale_v30.py
      - name: Verify intended scope
        run: |
          git diff --check
          git diff --exit-code -- Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -q 'bUseBuiltInRealCommunities' Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp
          grep -q 'FrequencyForWavelengthMeters(220.0f' Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          grep -q 'FCubusPhysicalTerrainScaleTest' Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate real-scale terrain and biome communities'
          git push origin HEAD:agent/density-meshing
