name: Agent finalize watertight density v2
on:
  push:
    branches: [agent/density-meshing]
    paths:
      - .github/agent/finalize_watertight_density_v2.py
      - .github/workflows/agent-finalize-watertight-density-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/agent/finalize_watertight_density_v2.py
      - run: |
          git diff --check
          grep -q "RegularCellClass\[256\]" Source/Orakai/CubusCore/Meshing/CubusTransvoxelTables.h
          grep -q "GetRegularTriangleEdge" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
          ! grep -q "GetTriangleEdge(" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
      - run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Meshing/CubusTransvoxelTables.h Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Align regular cells with Transvoxel topology'
          git push origin HEAD:agent/density-meshing
