name: Fix density LOD and cache safety v25
on:
  workflow_dispatch:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/fix_density_lod_and_surface_cache.py'
      - '.github/workflows/agent-fix-density-lod-cache-v25.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 .github/agent/fix_density_lod_and_surface_cache.py
      - name: Verify diff
        run: |
          git diff --check
          grep -n "const FSurfaceData Surface = GetCachedSurfaceData" Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          grep -n "const FVector SourceOrigin = LogicalOrigin \* static_cast<double>(SafeStride);" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -n "CurrentGenerationVersion = 25" Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
          git commit -m "Fix density LOD world alignment and cache lifetime"
          git push origin HEAD:agent/density-meshing
