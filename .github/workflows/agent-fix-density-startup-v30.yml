name: Agent fix density startup v30

on:
  push:
    branches:
      - agent/density-meshing
    paths:
      - .github/agent/fix_density_startup_v30.py
      - .github/workflows/agent-fix-density-startup-v30.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply startup fix
        run: python .github/agent/fix_density_startup_v30.py
      - name: Verify scope
        run: |
          git diff --check
          git diff -- Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
      - name: Commit changes
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Fix density startup bootstrap cost'
          git push origin HEAD:agent/density-meshing
