name: Fix duplicate alpine test variable
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Remove duplicate declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    TArray<uint8> Visited;\n    Visited.SetNumZeroed(MountainMask.Num());\n    int32 LongestConnectedRange = 0;\n    float MaximumAlpineHeight = -MAX_flt;\n    constexpr int32 NeighbourOffsets[8][2] =\n'''
          new = '''    TArray<uint8> Visited;\n    Visited.SetNumZeroed(MountainMask.Num());\n    int32 LongestConnectedRange = 0;\n    constexpr int32 NeighbourOffsets[8][2] =\n'''
          if text.count('float MaximumAlpineHeight = -MAX_flt;') != 2:
              raise RuntimeError('Expected exactly two MaximumAlpineHeight declarations before fix')
          if old not in text:
              raise RuntimeError('Duplicate declaration anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(grep -c 'float MaximumAlpineHeight = -MAX_flt;' Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp)" -eq 1
          grep -n 'MaximumAlpineHeight = FMath::Max' Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp
          grep -n 'Mountain systems reach a genuine alpine altitude band' Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp
          git commit -m 'Fix duplicate alpine height test variable'
          git push origin HEAD:agent/density-meshing
