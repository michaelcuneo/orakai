name: Fix far vegetation visibility

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          h = Path('Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h')
          once(
              h,
              '''    UFUNCTION(BlueprintPure, Category = "Cubus|Client Settings")\n    int32 GetClientChunkLoadRate() const { return MaxChunksGeneratedPerTick; }''',
              '''    UFUNCTION(BlueprintPure, Category = "Cubus|Client Settings")\n    int32 GetClientChunkLoadRate() const { return MaxChunksGeneratedPerTick; }\n\n    /** Canonical LOD0 voxel size used by world-space systems such as vegetation. */\n    float GetGeneratedVoxelSize() const\n    {\n        return GeneratedVoxelSize;\n    }''',
              'canonical voxel getter'
          )

          cpp = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp')

          # Never derive the world scale from an arbitrary registered chunk.
          once(
              cpp,
              '''    for (const auto& Pair : RegisteredChunks)\n    {\n        const ACubusVoxelVolumeActor* DistancePolicyChunk =\n            Pair.Value.Get();\n\n        if (IsValid(DistancePolicyChunk))\n        {\n            ApplyVegetationDistancePolicy(\n                DistancePolicyChunk->GetVoxelSize()\n            );\n            break;\n        }\n    }''',
              '''    ApplyVegetationDistancePolicy(\n        FMath::Max(\n            1.0f,\n            BlockWorld->GetGeneratedVoxelSize()\n        )\n    );''',
              'near distance canonical scale'
          )

          once(
              cpp,
              '''    const float SafeVoxelSize =\n        FMath::Max(\n            1.0f,\n            SnapshotChunk->GetVoxelSize()\n        );''',
              '''    // Far-cell ownership and world transforms must use the canonical\n    // LOD0 voxel scale. RegisteredChunks may contain authored or transitional\n    // chunks with a different VoxelSize, so choosing the first map entry makes\n    // the entire far forest scale nondeterministically.\n    const float SafeVoxelSize =\n        FMath::Max(\n            1.0f,\n            BlockWorld->GetGeneratedVoxelSize()\n        );''',
              'far canonical scale'
          )

          # Far HISM distance must be controlled by Cubus, not by a level CullDistanceVolume
          # or stale component max-draw-distance state.
          once(
              cpp,
              '''        FarComponent->SetCullDistances(\n            0,\n            FMath::Max(\n                1,\n                FMath::RoundToInt(\n                    FarVegetationEndCullDistance\n                )\n            )\n        );''',
              '''        FarComponent->SetCullDistances(\n            0,\n            FMath::Max(\n                1,\n                FMath::RoundToInt(\n                    FarVegetationEndCullDistance\n                )\n            )\n        );\n\n        // This component is the explicit long-range vegetation representation.\n        // Do not allow a Cull Distance Volume or inherited max draw distance to\n        // silently cull the whole far forest before our per-instance HISM range.\n        FarComponent->bAllowCullDistanceVolume = false;\n        FarComponent->SetCullDistance(0.0f);\n        FarComponent->SetVisibility(true, true);\n        FarComponent->SetHiddenInGame(false, true);''',
              'far external cull disable'
          )

          # Log the actual HISM instance population, not just accepted source trees.
          once(
              cpp,
              '''    RenderedFarTreeCount =\n        FarTreeCount;\n\n    bFarVegetationRenderDirty =\n        false;''',
              '''    int32 PublishedFarInstanceCount = 0;\n\n    for (\n        const TPair<\n            int64,\n            TObjectPtr<\n                UHierarchicalInstancedStaticMeshComponent\n            >\n        >& Pair\n        : FarCatalogStaticBatchComponents\n    )\n    {\n        if (IsValid(Pair.Value))\n        {\n            PublishedFarInstanceCount +=\n                Pair.Value->GetInstanceCount();\n        }\n    }\n\n    RenderedFarTreeCount =\n        PublishedFarInstanceCount;\n\n    bFarVegetationRenderDirty =\n        false;''',
              'published far instance count'
          )

          once(
              cpp,
              '''            "Cubus far vegetation: cells=%d "\n            "trees=%d pending=%d building=%d"''',
              '''            "Cubus far vegetation: cells=%d "\n            "trees=%d pending=%d building=%d voxel=%.2fcm"''',
              'far log format'
          )

          once(
              cpp,
              '''        RenderedFarTreeCount,\n        PendingFarVegetationCells.Num(),\n        FarVegetationBuilds.Num()\n    );''',
              '''        RenderedFarTreeCount,\n        PendingFarVegetationCells.Num(),\n        FarVegetationBuilds.Num(),\n        SafeVoxelSize\n    );''',
              'far log arguments'
          )
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -n "GetGeneratedVoxelSize" Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h
          grep -n "bAllowCullDistanceVolume = false" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "PublishedFarInstanceCount" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "voxel=%.2fcm" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git commit -m "Fix far vegetation world scale and culling"
          git push origin HEAD:agent/density-meshing
