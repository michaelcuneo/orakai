name: Fix forest coverage and cave shell

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          geology = Path('Source/Orakai/CubusCore/Data/CubusGeologyProfile.h')
          replace_once(
              geology,
              '    float ForestThreshold = 0.15f;',
              '    float ForestThreshold = 0.0f;',
              'forest threshold default'
          )

          biome = Path('Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp')
          replace_once(
              biome,
              '    Settings.ForestThreshold = GeologyProfile->ForestThreshold;',
              '''    // The legacy 0.15 threshold made forest dominance depend on a\n    // relatively rare positive canopy-noise lobe, producing isolated pockets\n    // even when the forest density itself looked correct. Preserve explicitly\n    // authored values, but migrate the exact old default to a balanced split.\n    Settings.ForestThreshold =\n        FMath::IsNearlyEqual(\n            GeologyProfile->ForestThreshold,\n            0.15f,\n            0.0001f\n        )\n            ? 0.0f\n            : GeologyProfile->ForestThreshold;''',
              'forest threshold migration'
          )

          density_h = Path('Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h')
          replace_once(
              density_h,
              '''    float SampleCaveDensity(\n        const FVector& GlobalSampleCoordinate,\n        float SurfaceVoxelHeight\n    ) const;''',
              '''    float SampleCaveDensity(\n        const FVector& GlobalSampleCoordinate,\n        float SurfaceVoxelHeight,\n        float SurfaceSlope\n    ) const;''',
              'cave declaration'
          )

          density_cpp = Path('Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp')
          replace_once(
              density_cpp,
              '''                SampleCaveDensity(\n                    GlobalSampleCoordinate,\n                    Column.SurfaceVoxelHeight\n                )''',
              '''                SampleCaveDensity(\n                    GlobalSampleCoordinate,\n                    Column.SurfaceVoxelHeight,\n                    Column.Slope\n                )''',
              'cave call'
          )
          replace_once(
              density_cpp,
              '''float FCubusTerrainDensityField::SampleCaveDensity(\n    const FVector& GlobalSampleCoordinate,\n    const float SurfaceVoxelHeight\n) const\n{\n    const float WorldZ =\n        static_cast<float>(GlobalSampleCoordinate.Z);\n\n    if (\n        WorldZ < Settings.CaveMinimumWorldZ ||\n        WorldZ > Settings.CaveMaximumWorldZ ||\n        WorldZ >\n            SurfaceVoxelHeight -\n            static_cast<float>(Settings.CaveSurfaceClearance)\n    )\n    {\n        return MAX_flt;\n    }''',
              '''float FCubusTerrainDensityField::SampleCaveDensity(\n    const FVector& GlobalSampleCoordinate,\n    const float SurfaceVoxelHeight,\n    const float SurfaceSlope\n) const\n{\n    const float WorldZ =\n        static_cast<float>(GlobalSampleCoordinate.Z);\n\n    const float VerticalDepth =\n        SurfaceVoxelHeight - WorldZ;\n\n    // Cave clearance must be measured approximately normal to the terrain\n    // shell, not purely vertically. On a steep hillside a point can be many\n    // voxels below the column height while still sitting immediately beside\n    // exterior air. Dividing by sqrt(1 + slope^2) converts vertical depth into\n    // the local planar normal distance and keeps caves contained inside the\n    // mountain shell instead of punching exposed/inverted-looking cavities\n    // through cliffs.\n    const float ApproximateShellDepth =\n        VerticalDepth /\n        FMath::Sqrt(\n            1.0f +\n            SurfaceSlope * SurfaceSlope\n        );\n\n    if (\n        WorldZ < Settings.CaveMinimumWorldZ ||\n        WorldZ > Settings.CaveMaximumWorldZ ||\n        ApproximateShellDepth <\n            static_cast<float>(Settings.CaveSurfaceClearance)\n    )\n    {\n        return MAX_flt;\n    }''',
              'cave shell clearance'
          )
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -n "ForestThreshold = 0.0f" Source/Orakai/CubusCore/Data/CubusGeologyProfile.h
          grep -n "legacy 0.15 threshold" Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp
          grep -n "ApproximateShellDepth" Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          grep -n "float SurfaceSlope" Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Data/CubusGeologyProfile.h Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.h Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          git commit -m "Broaden forests and contain caves"
          git push origin HEAD:agent/density-meshing
