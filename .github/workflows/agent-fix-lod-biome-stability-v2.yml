name: Fix LOD biome stability v2

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  fix-lod-biome-stability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Patch canonical surface material sampling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          p = Path('Source/Orakai/CubusCore/Data/CubusGeologyProfile.h')
          s = p.read_text(encoding='utf-8')
          s = once(s, '    float RockySlopeThreshold = 4.0f;', '    float RockySlopeThreshold = 1.15f;', 'geology rocky slope default')
          p.write_text(s, encoding='utf-8')

          p = Path('Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(s, '    Settings.RockySlopeThreshold = GeologyProfile->RockySlopeThreshold;', '''    // RockySlopeThreshold is a height-gradient magnitude, not degrees.\n    // The legacy default of 4.0 corresponds to ~76 degrees and allowed grass\n    // and forest well onto cliff faces. Migrate only that exact old default so\n    // explicitly authored geology values remain authoritative.\n    Settings.RockySlopeThreshold =\n        FMath::IsNearlyEqual(\n            GeologyProfile->RockySlopeThreshold,\n            4.0f,\n            0.001f\n        )\n            ? 1.15f\n            : GeologyProfile->RockySlopeThreshold;''', 'legacy rocky slope migration')
          p.write_text(s, encoding='utf-8')

          p = Path('Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h')
          s = p.read_text(encoding='utf-8')
          s = once(s, '''    static void BuildChunk(\n        const FCubusDensitySamplingBuffer& DensityBuffer,\n        float VoxelSize,\n        float IsoLevel,\n        TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n        int32& OutGeneratedTriangleCount\n    );''', '''    static void BuildChunk(\n        const FCubusDensitySamplingBuffer& DensityBuffer,\n        float VoxelSize,\n        float IsoLevel,\n        TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n        int32& OutGeneratedTriangleCount,\n        const ICubusDensityField* SurfaceMaterialField = nullptr\n    );''', 'BuildChunk declaration')
          p.write_text(s, encoding='utf-8')

          p = Path('Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(s, '''void FCubusDensityMesher::BuildChunk(\n    const FCubusDensitySamplingBuffer& DensityBuffer,\n    const float VoxelSize,\n    const float IsoLevel,\n    TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n    int32& OutGeneratedTriangleCount\n)''', '''void FCubusDensityMesher::BuildChunk(\n    const FCubusDensitySamplingBuffer& DensityBuffer,\n    const float VoxelSize,\n    const float IsoLevel,\n    TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n    int32& OutGeneratedTriangleCount,\n    const ICubusDensityField* SurfaceMaterialField\n)''', 'BuildChunk definition')

          old = '''                            EdgeVertices[\n                                EdgeIndex\n                            ].MaterialBlend =\n                                BuildCellMaterialBlend(\n                                    CornerSamples,\n                                    EdgeVertices[\n                                        EdgeIndex\n                                    ].GlobalSamplePosition,\n                                    GlobalCellOrigin,\n                                    1.0f,\n                                    IsoLevel,\n                                    EdgeVertices[\n                                        EdgeIndex\n                                    ].MaterialId\n                                );\n'''
          new = '''                            if (SurfaceMaterialField != nullptr)\n                            {\n                                FInterpolatedVertex& SurfaceVertex =\n                                    EdgeVertices[EdgeIndex];\n\n                                // Probe a tiny distance toward the solid side.\n                                // Coarse LOD passes its scaled canonical field,\n                                // so biome and slope are resolved at the actual\n                                // interpolated surface position instead of at\n                                // cell corners separated by an entire LOD stride.\n                                constexpr float MaterialProbeDepth = 0.001f;\n                                const FVector MaterialProbePosition =\n                                    SurfaceVertex.GlobalSamplePosition -\n                                    SurfaceVertex.Normal * MaterialProbeDepth;\n\n                                const FCubusDensitySample SurfaceSample =\n                                    SurfaceMaterialField->SampleContinuous(\n                                        MaterialProbePosition\n                                    );\n\n                                if (SurfaceSample.MaterialId > 0)\n                                {\n                                    SurfaceVertex.MaterialId =\n                                        ClampDensityMaterialId(SurfaceSample.MaterialId);\n                                    SetSingleMaterialBlend(\n                                        SurfaceVertex.MaterialBlend,\n                                        SurfaceVertex.MaterialId\n                                    );\n                                }\n                                else\n                                {\n                                    SurfaceVertex.MaterialBlend =\n                                        BuildCellMaterialBlend(\n                                            CornerSamples,\n                                            SurfaceVertex.GlobalSamplePosition,\n                                            GlobalCellOrigin,\n                                            1.0f,\n                                            IsoLevel,\n                                            SurfaceVertex.MaterialId\n                                        );\n                                }\n                            }\n                            else\n                            {\n                                EdgeVertices[EdgeIndex].MaterialBlend =\n                                    BuildCellMaterialBlend(\n                                        CornerSamples,\n                                        EdgeVertices[EdgeIndex].GlobalSamplePosition,\n                                        GlobalCellOrigin,\n                                        1.0f,\n                                        IsoLevel,\n                                        EdgeVertices[EdgeIndex].MaterialId\n                                    );\n                            }\n'''
          s = once(s, old, new, 'coarse surface material resample')
          p.write_text(s, encoding='utf-8')

          p = Path('Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(s, '''    FCubusDensityMesher::BuildChunk(\n        DensityBuffer,\n        Input.CanonicalVoxelSize *\n            static_cast<float>(SafeStride),\n        Input.IsoLevel,\n        Result.MaterialMeshes,\n        Result.GeneratedTriangleCount\n    );''', '''    FCubusDensityMesher::BuildChunk(\n        DensityBuffer,\n        Input.CanonicalVoxelSize *\n            static_cast<float>(SafeStride),\n        Input.IsoLevel,\n        Result.MaterialMeshes,\n        Result.GeneratedTriangleCount,\n        &ScaledField\n    );''', 'LOD BuildChunk material field')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n "RockySlopeThreshold = 1.15f" Source/Orakai/CubusCore/Data/CubusGeologyProfile.h
          grep -n "legacy default of 4.0" Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp
          grep -n "SurfaceMaterialField = nullptr" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h
          grep -n "MaterialProbeDepth" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
          grep -n "&ScaledField" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Data/CubusGeologyProfile.h Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git commit -m "Stabilize terrain biomes across LODs"
          git push origin HEAD:agent/density-meshing
