name: Fix LOD biome stability

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  fix-lod-biome-stability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Patch canonical surface material sampling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # New assets should use a realistic rocky slope threshold.
          p = Path('Source/Orakai/CubusCore/Data/CubusGeologyProfile.h')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '    float RockySlopeThreshold = 4.0f;',
              '    float RockySlopeThreshold = 1.15f;',
              'geology rocky slope default'
          )
          p.write_text(s, encoding='utf-8')

          # Existing geology assets serialized with the old 4.0 default must
          # get the corrected behavior without forcing the user to recreate them.
          p = Path('Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '    Settings.RockySlopeThreshold = GeologyProfile->RockySlopeThreshold;',
              '''    // RockySlopeThreshold is a height-gradient magnitude, not degrees.\n    // The legacy default of 4.0 corresponds to ~76 degrees and allowed grass\n    // and forest well onto cliff faces. Migrate only that exact old default so\n    // explicitly authored geology values remain authoritative.\n    Settings.RockySlopeThreshold =\n        FMath::IsNearlyEqual(\n            GeologyProfile->RockySlopeThreshold,\n            4.0f,\n            0.001f\n        )\n            ? 1.15f\n            : GeologyProfile->RockySlopeThreshold;''',
              'legacy rocky slope migration'
          )
          p.write_text(s, encoding='utf-8')

          # Allow a caller to provide a material field that is sampled at the
          # actual interpolated isosurface vertex. Ordinary LOD0 callers remain
          # unchanged through the default nullptr.
          p = Path('Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '''        TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n        int32& OutGeneratedTriangleCount\n    );''',
              '''        TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n        int32& OutGeneratedTriangleCount,\n        const ICubusDensityField* SurfaceMaterialField = nullptr\n    );''',
              'BuildChunk declaration'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '''    TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n    int32& OutGeneratedTriangleCount\n)''',
              '''    TMap<int32, FCubusMeshData>& OutMaterialMeshes,\n    int32& OutGeneratedTriangleCount,\n    const ICubusDensityField* SurfaceMaterialField\n)''',
              'BuildChunk definition'
          )

          old = '''                            EdgeVertices[\n                                EdgeIndex\n                            ].MaterialBlend =\n                                BuildCellMaterialBlend(\n                                    CornerSamples,\n                                    EdgeVertices[\n                                        EdgeIndex\n                                    ].GlobalSamplePosition,\n                                    GlobalCellOrigin,\n                                    1.0f,\n                                    IsoLevel,\n                                    EdgeVertices[\n                                        EdgeIndex\n                                    ].MaterialId\n                                );\n'''
          new = '''                            if (SurfaceMaterialField != nullptr)\n                            {\n                                FInterpolatedVertex& SurfaceVertex =\n                                    EdgeVertices[EdgeIndex];\n\n                                // Probe a tiny distance toward the solid side.\n                                // The field passed by coarse LOD is the scaled\n                                // canonical field, so this resolves biome and\n                                // slope at the actual interpolated surface\n                                // position instead of at a coarse cell corner.\n                                constexpr float MaterialProbeDepth = 0.001f;\n                                const FVector MaterialProbePosition =\n                                    SurfaceVertex.GlobalSamplePosition -\n                                    SurfaceVertex.Normal * MaterialProbeDepth;\n\n                                const FCubusDensitySample SurfaceSample =\n                                    SurfaceMaterialField->SampleContinuous(\n                                        MaterialProbePosition\n                                    );\n\n                                if (SurfaceSample.MaterialId > 0)\n                                {\n                                    SurfaceVertex.MaterialId =\n                                        ClampDensityMaterialId(\n                                            SurfaceSample.MaterialId\n                                        );\n\n                                    SetSingleMaterialBlend(\n                                        SurfaceVertex.MaterialBlend,\n                                        SurfaceVertex.MaterialId\n                                    );\n                                }\n                                else\n                                {\n                                    SurfaceVertex.MaterialBlend =\n                                        BuildCellMaterialBlend(\n                                            CornerSamples,\n                                            SurfaceVertex.GlobalSamplePosition,\n                                            GlobalCellOrigin,\n                                            1.0f,\n                                            IsoLevel,\n                                            SurfaceVertex.MaterialId\n                                        );\n                                }\n                            }\n                            else\n                            {\n                                EdgeVertices[\n                                    EdgeIndex\n                                ].MaterialBlend =\n                                    BuildCellMaterialBlend(\n                                        CornerSamples,\n                                        EdgeVertices[\n                                            EdgeIndex\n                                        ].GlobalSamplePosition,\n                                        GlobalCellOrigin,\n                                        1.0f,\n                                        IsoLevel,\n                                        EdgeVertices[\n                                            EdgeIndex\n                                        ].MaterialId\n                                    );\n                            }\n'''
          s = once(s, old, new, 'coarse surface material resample')
          p.write_text(s, encoding='utf-8')

          # LOD tiles opt into exact surface material resampling via the same
          # scaled field they use for geometry. LOD0 keeps existing behavior.
          p = Path('Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '''        Result.MaterialMeshes,\n        Result.GeneratedTriangleCount\n    );''',
              '''        Result.MaterialMeshes,\n        Result.GeneratedTriangleCount,\n        &ScaledField\n    );''',
              'LOD BuildChunk material field'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n "RockySlopeThreshold = 1.15f" Source/Orakai/CubusCore/Data/CubusGeologyProfile.h
          grep -n "legacy default of 4.0" Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp
          grep -n "SurfaceMaterialField = nullptr" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h
          grep -n "MaterialProbeDepth" Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
          grep -n "&ScaledField" Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Data/CubusGeologyProfile.h Source/Orakai/CubusCore/Generation/CubusBiomeField.cpp Source/Orakai/CubusCore/Meshing/CubusDensityMesher.h Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git commit -m "Stabilize terrain biomes across LODs"
          git push origin HEAD:agent/density-meshing
