name: Fix LOD parity and mountain distribution v26
on:
  workflow_dispatch:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/fix_lod_parity_and_mountain_distribution_v26.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 .github/agent/fix_lod_parity_and_mountain_distribution_v26.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
          git commit -m 'Restore LOD parity and distribute mountain ranges'
          git push origin HEAD:agent/density-meshing
