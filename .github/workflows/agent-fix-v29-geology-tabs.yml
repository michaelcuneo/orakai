name: Fix v29 geology tabs
on:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/fix_v29_geology_tabs.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - run: python .github/agent/fix_v29_geology_tabs.py
      - run: git diff --check && git diff
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp
          git commit -m "Fix v29 geology source formatting"
          git push origin HEAD:agent/density-meshing
