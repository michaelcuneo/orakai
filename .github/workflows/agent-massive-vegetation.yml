name: Massive vegetation scale

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  massive-vegetation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Expand far vegetation to horizon scale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'int32 FarVegetationCellSizeChunks = 8;': 'int32 FarVegetationCellSizeChunks = 12;',
              'int32 FarVegetationRadiusCells = 16;': 'int32 FarVegetationRadiusCells = 24;',
              'float FarVegetationInnerRadius = 20000.0f;': 'float FarVegetationInnerRadius = 60000.0f;',
              'float FarVegetationEndCullDistance = 450000.0f;': 'float FarVegetationEndCullDistance = 800000.0f;',
              'int32 FarTreeSampleStrideVoxels = 4;': 'int32 FarTreeSampleStrideVoxels = 3;',
              'float FarTreeDensityScale = 0.35f;': 'float FarTreeDensityScale = 0.75f;',
              'float FarVegetationPublishInterval = 0.5f;': 'float FarVegetationPublishInterval = 1.0f;',
              'ClampMax = "500000"\n        )\n    )\n    int32 MaximumFarRenderedTrees = 150000;': 'ClampMax = "2000000"\n        )\n    )\n    int32 MaximumFarRenderedTrees = 750000;',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          text = text.replace(
              '     * 8 chunks * 32 voxels * 1m = 256m with the current world scale.',
              '     * Default 12 chunks keeps cell count manageable while reaching the horizon tier.'
          )
          text = text.replace(
              '     * 16 cells * 256m ~= 4.1km of far-forest coverage.',
              '     * With the current 80cm canonical voxel, 24.5 * 12 * 32 * 0.8m ~= 7.5km.'
          )
          text = text.replace(
              '     * Far representatives are hidden close to the camera because ordinary\n     * streamed vegetation owns that region.',
              '     * Far representatives begin outside the dense gameplay vegetation core,\n     * with a broad overlap so the forest does not disappear at the handoff.'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n "FarVegetationCellSizeChunks = 12" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarVegetationRadiusCells = 24" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarVegetationEndCullDistance = 800000.0f" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarTreeSampleStrideVoxels = 3" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarTreeDensityScale = 0.75f" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "MaximumFarRenderedTrees = 750000" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          git commit -m "Expand vegetation to horizon scale"
          git push origin HEAD:agent/density-meshing
