name: Overhaul density v29
on:
  push:
    branches:
      - agent/density-meshing
    paths:
      - '.github/agent/overhaul_density_v29.py'
      - '.github/workflows/agent-overhaul-density-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply terrain and density overhaul
        run: python .github/agent/overhaul_density_v29.py
      - name: Review patch
        run: git diff --check && git diff --stat && git diff
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Generation/CubusTerrainDensityField.cpp Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h Source/Orakai/CubusCore/Tests/CubusTerrainFormTests.cpp
          git commit -m "Overhaul continuous terrain density generation"
          git push origin HEAD:agent/density-meshing
