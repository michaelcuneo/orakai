name: Apply pawn-centred streaming patch

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  patch-streaming-origins:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Patch streaming ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # LOD0 gameplay terrain follows the controlled pawn.
          path = Path("Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp")
          text = path.read_text(encoding="utf-8")
          start = text.index("void ACubusBlockWorldActor::UpdateRuntimeStreaming(const bool bForce)")
          anchor = text.index("    const FIntVector CentreCoordinate =", start)
          text = text[:start] + '''void ACubusBlockWorldActor::UpdateRuntimeStreaming(const bool bForce)
          {
              APawn* PlayerPawn = TrackedPawn.Get();

              if (!IsValid(PlayerPawn))
              {
                  PlayerPawn = UGameplayStatics::GetPlayerPawn(this, 0);
                  if (IsValid(PlayerPawn))
                  {
                      TrackedPawn = PlayerPawn;
                  }
              }

              /*
               * Gameplay world ownership follows the pawn. A third-person
               * camera may orbit or lag independently and must not stream
               * terrain underneath the character.
               */
              const FVector TrackingLocation =
                  bPawnHeldForStreaming
                      ? HeldPawnLocation
                      : (IsValid(PlayerPawn)
                          ? PlayerPawn->GetActorLocation()
                          : GetActorLocation());

          ''' + text[anchor:]
          path.write_text(text, encoding="utf-8")

          # Vegetation ownership follows pawn; camera stays for hero rendering.
          path = Path("Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp")
          text = path.read_text(encoding="utf-8")
          if '#include "GameFramework/Pawn.h"' not in text:
              text = once(
                  text,
                  '#include "GameFramework/PlayerController.h"\n',
                  '#include "GameFramework/Pawn.h"\n#include "GameFramework/PlayerController.h"\n',
                  "Pawn include"
              )

          # Tick saturated-budget recenter.
          start = text.index("void ACubusWorldVegetationActor::Tick(const float DeltaSeconds)")
          end = text.index("void ACubusWorldVegetationActor::EndPlay(", start)
          part = text[start:end]
          rs = part.index("    bool bCameraRecenterRequired = false;")
          re = part.index("    if (\n        CurrentHash !=", rs)
          part = part[:rs] + '''    bool bStreamingRecenterRequired = false;

              if (
                  bPublishedVegetationBudgetSaturated &&
                  bHasLastFullVegetationBuildCameraLocation
              )
              {
                  const APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(this, 0);
                  if (IsValid(PlayerPawn))
                  {
                      const FVector StreamingLocation = PlayerPawn->GetActorLocation();
                      const double RecenterDistance = static_cast<double>(
                          FMath::Max(100.0f, VegetationRecenterDistance)
                      );
                      bStreamingRecenterRequired =
                          FVector::DistSquared(
                              StreamingLocation,
                              LastFullVegetationBuildCameraLocation
                          ) >= RecenterDistance * RecenterDistance;
                  }
              }

          ''' + part[re:]
          part = once(part, "        bCameraRecenterRequired\n", "        bStreamingRecenterRequired\n", "Tick flag")
          text = text[:start] + part + text[end:]

          # RebuildWorldVegetation: split visual camera from ownership origin.
          start = text.index("void ACubusWorldVegetationActor::RebuildWorldVegetation()")
          end = text.index("void ACubusWorldVegetationActor::ClearWorldVegetation()", start)
          part = text[start:end]
          old_origin = '''    const APlayerController* PlayerController =
                  UGameplayStatics::GetPlayerController(this, 0);

              const bool bHasCamera =
                  IsValid(PlayerController) &&
                  IsValid(PlayerController->PlayerCameraManager);

              const bool bUseCameraChunkCulling =
                  bCullByCameraChunkRadius &&
                  bHasCamera;

              const FVector CameraLocation = bHasCamera
                  ? PlayerController->PlayerCameraManager->GetCameraLocation()
                  : FVector::ZeroVector;
          '''
          new_origin = '''    const APlayerController* PlayerController =
                  UGameplayStatics::GetPlayerController(this, 0);

              const bool bHasCamera =
                  IsValid(PlayerController) &&
                  IsValid(PlayerController->PlayerCameraManager);

              const FVector CameraLocation = bHasCamera
                  ? PlayerController->PlayerCameraManager->GetCameraLocation()
                  : FVector::ZeroVector;

              const APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(this, 0);
              const bool bHasStreamingOrigin = IsValid(PlayerPawn);
              const FVector StreamingLocation = bHasStreamingOrigin
                  ? PlayerPawn->GetActorLocation()
                  : FVector::ZeroVector;

              const bool bUseCameraChunkCulling =
                  bCullByCameraChunkRadius &&
                  bHasStreamingOrigin;
          '''
          part = once(part, old_origin, new_origin, "Rebuild origin")

          filter_arg = "                CameraLocation,\n                bUseCameraChunkCulling,\n"
          if part.count(filter_arg) != 2:
              raise RuntimeError(f"Rebuild filters: expected 2, found {part.count(filter_arg)}")
          part = part.replace(filter_arg, "                StreamingLocation,\n                bUseCameraChunkCulling,\n", 2)

          part = once(
              part,
              "        bHasCamera &&\n        bHasLastFullVegetationBuildCameraLocation",
              "        bHasStreamingOrigin &&\n        bHasLastFullVegetationBuildCameraLocation",
              "Recenter availability"
          )
          part = once(
              part,
              "                CameraLocation,\n                LastFullVegetationBuildCameraLocation",
              "                StreamingLocation,\n                LastFullVegetationBuildCameraLocation",
              "Recenter origin"
          )

          sort_start = part.index("    VegetationChunkCoordinates.Sort(")
          sort_end = part.index("    for (\n        const FIntVector& ChunkCoordinate", sort_start)
          sort_block = part[sort_start:sort_end].replace("CameraLocation", "StreamingLocation")
          part = part[:sort_start] + sort_block + part[sort_end:]

          part = once(
              part,
              "        bFullVegetationRebuild &&\n        bHasCamera\n",
              "        bFullVegetationRebuild &&\n        bHasStreamingOrigin\n",
              "Full rebuild origin availability"
          )
          part = once(
              part,
              "        LastFullVegetationBuildCameraLocation =\n            CameraLocation;",
              "        LastFullVegetationBuildCameraLocation =\n            StreamingLocation;",
              "Full rebuild origin location"
          )
          text = text[:start] + part + text[end:]

          # Loaded placement hash / chunk-radius ownership.
          start = text.index("uint32 ACubusWorldVegetationActor::CalculateLoadedPlacementHash(")
          end = text.index("void ACubusWorldVegetationActor::RefreshVegetationBatches()", start)
          part = text[start:end]
          origin_start = part.index("    const APlayerController* PlayerController =")
          signatures = part.index("    TMap<FIntVector, uint32>", origin_start)
          part = part[:origin_start] + '''    const APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(this, 0);
              const bool bHasStreamingOrigin = IsValid(PlayerPawn);
              const bool bUseCameraChunkCulling =
                  bCullByCameraChunkRadius && bHasStreamingOrigin;
              const FVector StreamingLocation = bHasStreamingOrigin
                  ? PlayerPawn->GetActorLocation()
                  : FVector::ZeroVector;

          ''' + part[signatures:]
          part = part.replace("CameraLocation", "StreamingLocation")
          text = text[:start] + part + text[end:]

          # Far vegetation cell window and radial representative population.
          start = text.index("ACubusWorldVegetationActor::UpdateFarVegetationStreaming(")
          end = text.index("void\nACubusWorldVegetationActor::PublishFarVegetation(", start)
          part = text[start:end]
          origin_start = part.index("    const APlayerController* PlayerController =")
          snapshot = part.index("    ACubusVoxelVolumeActor* SnapshotChunk =", origin_start)
          part = part[:origin_start] + '''    const APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(this, 0);

              if (!IsValid(PlayerPawn))
              {
                  return;
              }

              const FVector StreamingLocation = PlayerPawn->GetActorLocation();

          ''' + part[snapshot:]
          part = part.replace("CameraLocation", "StreamingLocation")
          part = part.replace("CameraWorldVoxel", "StreamingWorldVoxel")
          text = text[:start] + part + text[end:]
          path.write_text(text, encoding="utf-8")

          # Declaration terminology only.
          path = Path("Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h")
          text = path.read_text(encoding="utf-8")
          text = once(text, "        const FVector& CameraGridLocation,\n", "        const FVector& StreamingGridLocation,\n", "Terrain declaration")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          git diff --stat
          sed -n '/UpdateRuntimeStreaming(const bool bForce)/,/const FIntVector CentreCoordinate/p' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp | grep -q GetCameraLocation && exit 1 || true
          grep -n StreamingLocation Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp | head -20

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h
          git commit -m "Anchor world streaming to player pawn"
          git push origin HEAD:agent/density-meshing
