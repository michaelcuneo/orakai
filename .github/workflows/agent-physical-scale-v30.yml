name: Agent physical world scale v30

on:
  push:
    branches: [agent/density-meshing]
    paths:
      - .github/agent/physical_scale_v30.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply physical scale migration
        run: python .github/agent/physical_scale_v30.py
      - name: Verify intended scope
        run: |
          git diff --check
          git diff --exit-code -- Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -q 'CurrentGenerationVersion = 30' Source/Orakai/CubusCore/Generation/CubusGenerationSeeds.h
          grep -q 'MountainSystemSpacingKm' Source/Orakai/CubusCore/Generation/CubusTerrainForm.cpp
          grep -q 'RockyTreeDensity' Source/Orakai/CubusCore/Generation/CubusBlockVegetationGenerator.cpp
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Scale terrain and biomes in real-world units'
          git push origin HEAD:agent/density-meshing
