name: Progressive far vegetation

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Apply progressive far vegetation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          h = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h')

          once(
              h,
              '''struct FCubusFarVegetationCellBuildResult\n{\n    FIntPoint CellCoordinate =\n        FIntPoint::ZeroValue;\n\n    TArray<FCubusVegetationInstance> Trees;\n};''',
              '''struct FCubusFarVegetationCellBuildResult\n{\n    FIntPoint CellCoordinate =\n        FIntPoint::ZeroValue;\n\n    int32 RefinementPass = 0;\n\n    TArray<FCubusVegetationInstance> Trees;\n};''',
              'result pass'
          )

          once(
              h,
              '''struct FCubusFarVegetationCellBuild\n{\n    FIntPoint CellCoordinate =\n        FIntPoint::ZeroValue;\n\n    UE::Tasks::TTask<\n        FCubusFarVegetationCellBuildResult\n    > Task;\n};''',
              '''struct FCubusFarVegetationCellBuild\n{\n    FIntPoint CellCoordinate =\n        FIntPoint::ZeroValue;\n\n    int32 RefinementPass = 0;\n\n    UE::Tasks::TTask<\n        FCubusFarVegetationCellBuildResult\n    > Task;\n};''',
              'build pass'
          )

          once(
              h,
              '''    TMap<\n        FIntPoint,\n        TArray<FCubusVegetationInstance>\n    > FarVegetationCellCache;\n\n    float TimeUntilFarVegetationPublish =\n        0.0f;''',
              '''    TMap<\n        FIntPoint,\n        TArray<FCubusVegetationInstance>\n    > FarVegetationCellCache;\n\n    // Highest completed refinement pass for each cached cell. Pass 0 is a\n    // sparse horizon representation, pass 1 is medium density and pass 2 is\n    // the configured full far-tree density.\n    TMap<FIntPoint, int32>\n        FarVegetationCellRefinementPasses;\n\n    int32 FarVegetationRefinementPass = 0;\n\n    float TimeUntilFarVegetationPublish =\n        0.0f;''',
              'cache refinement state'
          )

          cpp = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp')

          # Reset to sparse coverage whenever the streaming centre changes.
          once(
              cpp,
              '''        LastFarVegetationCentreCell =\n            CentreCell;\n\n        RequiredFarVegetationCells.Reset();\n        PendingFarVegetationCells.Reset();''',
              '''        LastFarVegetationCentreCell =\n            CentreCell;\n\n        // Every recenter begins by filling any newly visible cells with the\n        // sparse horizon pass. Existing cached cells already at a higher pass\n        // are retained and simply satisfy this pass immediately.\n        FarVegetationRefinementPass = 0;\n\n        RequiredFarVegetationCells.Reset();\n        PendingFarVegetationCells.Reset();''',
              'recenter pass reset'
          )

          # Remove refinement metadata with evicted cells.
          once(
              cpp,
              '''                FarVegetationCellCache.Remove(\n                    Cell\n                );\n\n                bFarVegetationRenderDirty =\n                    true;''',
              '''                FarVegetationCellCache.Remove(\n                    Cell\n                );\n                FarVegetationCellRefinementPasses.Remove(\n                    Cell\n                );\n\n                bFarVegetationRenderDirty =\n                    true;''',
              'evict pass metadata'
          )

          # Replace old cache-present skip with pass-aware scheduling.
          once(
              cpp,
              '''            if (\n                FarVegetationCellCache.Contains(\n                    Cell\n                ) ||\n                FarVegetationCellsBuilding.Contains(\n                    Cell\n                )\n            )\n            {\n                continue;\n            }\n\n            PendingFarVegetationCells.Add(\n                Cell\n            );''',
              '''            const int32 CompletedPass =\n                FarVegetationCellRefinementPasses.FindRef(\n                    Cell\n                );\n\n            const bool bHasCachedCell =\n                FarVegetationCellCache.Contains(Cell);\n\n            if (\n                FarVegetationCellsBuilding.Contains(Cell) ||\n                (\n                    bHasCachedCell &&\n                    CompletedPass >= FarVegetationRefinementPass\n                )\n            )\n            {\n                continue;\n            }\n\n            PendingFarVegetationCells.Add(Cell);''',
              'pass-aware initial scheduling'
          )

          # A completed result replaces the lower-detail representation and records quality.
          once(
              cpp,
              '''            FarVegetationCellCache.Add(\n                Result.CellCoordinate,\n                MoveTemp(\n                    Result.Trees\n                )\n            );\n\n            bFarVegetationRenderDirty =\n                true;''',
              '''            FarVegetationCellCache.Add(\n                Result.CellCoordinate,\n                MoveTemp(\n                    Result.Trees\n                )\n            );\n\n            FarVegetationCellRefinementPasses.Add(\n                Result.CellCoordinate,\n                Result.RefinementPass\n            );\n\n            bFarVegetationRenderDirty =\n                true;''',
              'record completed pass'
          )

          # Advance globally only after every required cell has the current pass.
          marker = '''    /*\n     * Start a bounded number of new worker jobs.\n     */'''
          insertion = '''    // Do not spend full-density work on the nearby part of the\n    // window while most of the horizon is still empty. Once every required\n    // cell has the current pass, advance the entire window together. Because\n    // pass strides are exact multiples (12 -> 6 -> configured 3 by default),\n    // existing tree sample positions are a deterministic subset of later\n    // passes, so refinement adds detail rather than relocating the forest.\n    if (\n        PendingFarVegetationCells.IsEmpty() &&\n        FarVegetationBuilds.IsEmpty() &&\n        FarVegetationRefinementPass < 2\n    )\n    {\n        ++FarVegetationRefinementPass;\n\n        for (\n            const FIntPoint& Cell\n            : RequiredFarVegetationCells\n        )\n        {\n            const int32* CompletedPass =\n                FarVegetationCellRefinementPasses.Find(Cell);\n\n            if (\n                CompletedPass == nullptr ||\n                *CompletedPass < FarVegetationRefinementPass\n            )\n            {\n                PendingFarVegetationCells.Add(Cell);\n            }\n        }\n\n        PendingFarVegetationCells.Sort(\n            [CentreCell](\n                const FIntPoint& A,\n                const FIntPoint& B\n            )\n            {\n                const int32 DistanceA =\n                    FMath::Abs(A.X - CentreCell.X) +\n                    FMath::Abs(A.Y - CentreCell.Y);\n                const int32 DistanceB =\n                    FMath::Abs(B.X - CentreCell.X) +\n                    FMath::Abs(B.Y - CentreCell.Y);\n\n                return DistanceA > DistanceB;\n            }\n        );\n\n        UE_LOG(\n            LogTemp,\n            Display,\n            TEXT(\n                "Cubus far vegetation refinement: pass=%d pending=%d"\n            ),\n            FarVegetationRefinementPass,\n            PendingFarVegetationCells.Num()\n        );\n    }\n\n'''
          once(cpp, marker, insertion + marker, 'refinement advancement')

          # Cache should not disqualify a cell that is being refined.
          once(
              cpp,
              '''            FarVegetationCellCache.Contains(\n                Cell\n            ) ||\n            FarVegetationCellsBuilding.Contains(\n                Cell\n            )''',
              '''            (\n                FarVegetationCellCache.Contains(Cell) &&\n                FarVegetationCellRefinementPasses.FindRef(Cell) >=\n                    FarVegetationRefinementPass\n            ) ||\n            FarVegetationCellsBuilding.Contains(\n                Cell\n            )''',
              'worker pass cache gate'
          )

          # Replace a single full-density stride with 3-pass progressive stride.
          once(
              cpp,
              '''        const int32 SampleStride =\n            FMath::Clamp(\n                FarTreeSampleStrideVoxels,\n                2,\n                64\n            );\n\n        const float DensityScale =''',
              '''        const int32 FullSampleStride =\n            FMath::Clamp(\n                FarTreeSampleStrideVoxels,\n                2,\n                64\n            );\n\n        const int32 RefinementPass =\n            FMath::Clamp(\n                FarVegetationRefinementPass,\n                0,\n                2\n            );\n\n        int32 SampleStride = FullSampleStride;\n\n        if (RefinementPass == 0)\n        {\n            SampleStride =\n                FMath::Clamp(\n                    FullSampleStride * 4,\n                    FullSampleStride,\n                    64\n                );\n        }\n        else if (RefinementPass == 1)\n        {\n            SampleStride =\n                FMath::Clamp(\n                    FullSampleStride * 2,\n                    FullSampleStride,\n                    64\n                );\n        }\n\n        const float DensityScale =''',
              'progressive sample stride'
          )

          once(
              cpp,
              '''        Build.CellCoordinate =\n            Cell;\n\n        Build.Task =''',
              '''        Build.CellCoordinate =\n            Cell;\n        Build.RefinementPass =\n            RefinementPass;\n\n        Build.Task =''',
              'build pass set'
          )

          # Capture and propagate the pass into result.
          once(
              cpp,
              '''                    DensitySettings,\n                    SampleStride,\n                    DensityScale\n                ]()''',
              '''                    DensitySettings,\n                    SampleStride,\n                    DensityScale,\n                    RefinementPass\n                ]()''',
              'lambda pass capture'
          )

          once(
              cpp,
              '''                    Result.CellCoordinate =\n                        Cell;\n\n                    const FCubusTerrainDensityField''',
              '''                    Result.CellCoordinate =\n                        Cell;\n                    Result.RefinementPass =\n                        RefinementPass;\n\n                    const FCubusTerrainDensityField''',
              'result pass set'
          )

          # Clear refinement state too.
          once(
              cpp,
              '''    FarVegetationCellCache.Reset();\n\n    LastFarVegetationCentreCell =''',
              '''    FarVegetationCellCache.Reset();\n    FarVegetationCellRefinementPasses.Reset();\n    FarVegetationRefinementPass = 0;\n\n    LastFarVegetationCentreCell =''',
              'clear refinement state'
          )

          # Include current pass in existing far log.
          once(
              cpp,
              '''            "Cubus far vegetation: cells=%d "\n            "trees=%d pending=%d building=%d voxel=%.2fcm"''',
              '''            "Cubus far vegetation: cells=%d "\n            "trees=%d pending=%d building=%d voxel=%.2fcm pass=%d"''',
              'far pass log format'
          )

          once(
              cpp,
              '''        FarVegetationBuilds.Num(),\n        SafeVoxelSize\n    );''',
              '''        FarVegetationBuilds.Num(),\n        SafeVoxelSize,\n        FarVegetationRefinementPass\n    );''',
              'far pass log args'
          )
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -n "FarVegetationRefinementPass" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FullSampleStride \* 4" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "far vegetation refinement" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "pass=%d" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git commit -m "Progressively fill far vegetation horizon"
          git push origin HEAD:agent/density-meshing
