name: Harden outer density clipmaps
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Normalize migration
        run: python3 .github/agent/normalize_outer_clipmap_helper.py
      - name: Apply outer clipmap hardening
        run: python3 .github/agent/harden_density_outer_clipmaps.py
      - name: Verify and commit source only
        run: |
          git diff --check
          grep -n 'ScaleDownExact(PreviousBounds, 2)' Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -n 'RetireStableTierWindows' Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          grep -n 'ResolvedTransitionSignatures' Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Stabilize outer density clipmaps'
          git push origin HEAD:agent/density-meshing
