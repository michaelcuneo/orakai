name: Stabilize terrain streaming altitude
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Normalize cleanup anchors
        run: python3 .github/agent/normalize_lod_cleanup.py
      - name: Apply coherent LOD cleanup
        run: python3 .github/agent/lod_topology_cleanup.py
      - name: Verify source
        run: git diff --check
      - name: Commit source
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.cpp Source/Orakai/CubusCore/Actors/CubusTerrainLodWorldActor.h && git diff --cached --check && (git diff --cached --quiet || git commit -m 'Make density LOD streaming coherent') && git push origin HEAD:agent/density-meshing
