name: Harden density LOD streaming
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply guarded density LOD hardening
        run: python3 .github/agent/harden_density_lod0.py
      - name: Verify and commit source only
        run: |
          git diff --check
          grep -n 'BuildDensitySurfaceRequiredCoordinates' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          grep -n 'TryCommitDensityLodTransition' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          grep -n 'BuildAlignedCoverage' Source/Orakai/CubusCore/Meshing/CubusDensityLod.h
          grep -n 'checkSlow(FVector::DotProduct' Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Meshing/CubusDensityLod.h Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Harden density LOD streaming and seams'
          git push origin HEAD:agent/density-meshing
