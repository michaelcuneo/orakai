name: Optimize density surface window
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply density surface optimization
        run: python3 .github/agent/optimize_density_surface_window.py
      - name: Verify and commit source only
        run: |
          git diff --check
          grep -n 'SurfaceSamplesPerAxis = 3' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          grep -n 'bStreamingWindowChanged' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.h Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Optimize density surface streaming window'
          git push origin HEAD:agent/density-meshing
