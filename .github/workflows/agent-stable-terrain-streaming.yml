name: Harden density LOD streaming
on:
  push:
    branches:
      - agent/density-meshing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0
      - name: Apply guarded density LOD hardening
        run: python3 .github/agent/harden_density_lod0.py
      - name: Verify source
        run: |
          git diff --check
          grep -n 'BuildDensitySurfaceRequiredCoordinates' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          grep -n 'TryCommitDensityLodTransition' Source/Orakai/CubusCore/Actors/CubusBlockWorldActor.cpp
          grep -n 'BuildAlignedCoverage' Source/Orakai/CubusCore/Meshing/CubusDensityLod.h
          grep -n 'checkSlow(FVector::DotProduct' Source/Orakai/CubusCore/Meshing/CubusDensityMesher.cpp
      - name: Commit source and self-clean runner
        run: |
          git show 8f598d1b453f971841c071ac0f5f47607c788c43:.github/workflows/agent-stable-terrain-streaming.yml > .github/workflows/agent-stable-terrain-streaming.yml
          rm -f .github/workflows/agent-harden-density-lod0.yml
          rm -f .github/agent/harden_density_lod0.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Source/Orakai/CubusCore .github/workflows .github/agent
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Harden density LOD streaming and seams'
          git push origin HEAD:agent/density-meshing
