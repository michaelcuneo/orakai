name: Apply vegetation distance policy v3

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Apply corrected patch body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent-unify-vegetation-distances.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("          PY\n", start)
          body = workflow[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          old = "tail = once(tail, registered_anchor, registered_replacement, 'apply policy during rebuild')"
          new = "tail = tail.replace(registered_anchor, registered_replacement, 1)"
          if old not in body:
              raise RuntimeError('expected rebuild anchor patch line not found')
          body = body.replace(old, new, 1)
          exec(compile(body, '<vegetation-distance-patch>', 'exec'))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -n "PlantStartCullDistance = 16000" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "PlantEndCullDistance = 22000" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarVegetationInnerRadius = 16000.0f" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "ResolveVegetationDistancePolicy" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "Cubus vegetation distance policy" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "DistancePolicy.FarInnerRadius" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git commit -m "Unify vegetation distance handoff"
          git push origin HEAD:agent/density-meshing
