name: Unify vegetation distance policy

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Patch vegetation distance policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          hp = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h')
          h = hp.read_text(encoding='utf-8')

          h = once(h, '    int32 PlantStartCullDistance = 30000;', '    int32 PlantStartCullDistance = 16000;', 'near start default')
          h = once(h, '    int32 PlantEndCullDistance = 120000;', '    int32 PlantEndCullDistance = 22000;', 'near end default')
          h = once(h, '    float FarVegetationInnerRadius = 60000.0f;', '    float FarVegetationInnerRadius = 16000.0f;', 'far inner default')

          anchor = '''    FCubusVegetationCatalog VegetationCatalog;\n    FCubusVegetationRenderer VegetationRenderer;\n    FCubusVegetationPlacement VegetationPlacement;\n\n    void ResolveBlockWorld();'''
          replacement = '''    FCubusVegetationCatalog VegetationCatalog;\n    FCubusVegetationRenderer VegetationRenderer;\n    FCubusVegetationPlacement VegetationPlacement;\n\n    struct FCubusVegetationDistancePolicy\n    {\n        int32 NearStartCullDistance = 0;\n        int32 NearEndCullDistance = 0;\n        float FarInnerRadius = 0.0f;\n        float NearResidentRadius = 0.0f;\n    };\n\n    FCubusVegetationDistancePolicy ResolveVegetationDistancePolicy(\n        float VoxelSize\n    ) const;\n\n    void ApplyVegetationDistancePolicy(\n        float VoxelSize\n    );\n\n    void ResolveBlockWorld();'''
          h = once(h, anchor, replacement, 'distance policy declarations')
          hp.write_text(h, encoding='utf-8')

          cp = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp')
          c = cp.read_text(encoding='utf-8')

          insert_before = 'void ACubusWorldVegetationActor::RefreshVegetationBatches()\n{'
          implementation = r'''ACubusWorldVegetationActor::FCubusVegetationDistancePolicy
ACubusWorldVegetationActor::ResolveVegetationDistancePolicy(
    const float VoxelSize
) const
{
    FCubusVegetationDistancePolicy Policy;

    Policy.NearStartCullDistance =
        FMath::Max(0, PlantStartCullDistance);

    Policy.NearEndCullDistance =
        FMath::Max(
            Policy.NearStartCullDistance,
            PlantEndCullDistance
        );

    Policy.FarInnerRadius =
        FMath::Max(0.0f, FarVegetationInnerRadius);

    if (!bCullByCameraChunkRadius)
    {
        Policy.NearResidentRadius =
            static_cast<float>(Policy.NearEndCullDistance);
        return Policy;
    }

    const float SafeVoxelSize =
        FMath::Max(1.0f, VoxelSize);

    const float ChunkWorldSize =
        static_cast<float>(Cubus::ChunkSize) *
        SafeVoxelSize;

    /*
     * Chunk culling is inclusive. Radius 8 therefore owns chunk centres out to
     * 8 chunks, plus half a chunk of physical coverage at the edge.
     */
    Policy.NearResidentRadius =
        (
            static_cast<float>(
                FMath::Max(0, CameraChunkHorizontalRadius)
            ) +
            0.5f
        ) *
        ChunkWorldSize;

    /*
     * Keep at least two ordinary chunks of overlap between the detailed and
     * far representations. This prevents a residency/cull gap even when old
     * Blueprint values still contain kilometre-scale near cull distances.
     */
    const float OverlapDistance =
        FMath::Min(
            Policy.NearResidentRadius,
            FMath::Max(
                ChunkWorldSize * 2.0f,
                Policy.NearResidentRadius * 0.20f
            )
        );

    const float LatestSafeFarStart =
        FMath::Max(
            0.0f,
            Policy.NearResidentRadius -
            OverlapDistance
        );

    Policy.FarInnerRadius =
        FMath::Min(
            Policy.FarInnerRadius,
            LatestSafeFarStart
        );

    Policy.NearEndCullDistance =
        FMath::Max(
            1,
            FMath::RoundToInt(
                FMath::Min(
                    static_cast<float>(
                        Policy.NearEndCullDistance
                    ),
                    Policy.NearResidentRadius
                )
            )
        );

    Policy.NearStartCullDistance =
        FMath::Clamp(
            FMath::Min(
                Policy.NearStartCullDistance,
                FMath::RoundToInt(
                    Policy.FarInnerRadius
                )
            ),
            0,
            Policy.NearEndCullDistance
        );

    return Policy;
}

void ACubusWorldVegetationActor::ApplyVegetationDistancePolicy(
    const float VoxelSize
)
{
    const FCubusVegetationDistancePolicy Policy =
        ResolveVegetationDistancePolicy(VoxelSize);

    for (const auto& Pair : CatalogGrassBatchComponents)
    {
        if (IsValid(Pair.Value))
        {
            Pair.Value->SetCullDistances(
                Policy.NearStartCullDistance,
                Policy.NearEndCullDistance
            );
        }
    }

    for (const auto& Pair : CatalogStaticBatchComponents)
    {
        if (IsValid(Pair.Value))
        {
            Pair.Value->SetCullDistances(
                Policy.NearStartCullDistance,
                Policy.NearEndCullDistance
            );
        }
    }

    static bool bLoggedVegetationDistancePolicy = false;
    if (!bLoggedVegetationDistancePolicy)
    {
        UE_LOG(
            LogTemp,
            Display,
            TEXT(
                "Cubus vegetation distance policy: nearResident=%.0fcm "
                "nearCull=%d..%dcm farInner=%.0fcm farEnd=%.0fcm "
                "chunkRadius=(%d,%d) recenter=%.0fcm"
            ),
            Policy.NearResidentRadius,
            Policy.NearStartCullDistance,
            Policy.NearEndCullDistance,
            Policy.FarInnerRadius,
            FarVegetationEndCullDistance,
            CameraChunkHorizontalRadius,
            CameraChunkVerticalRadius,
            VegetationRecenterDistance
        );

        bLoggedVegetationDistancePolicy = true;
    }
}

'''
          c = once(c, insert_before, implementation + insert_before, 'distance policy implementation')

          registered_anchor = '''    const auto& RegisteredChunks =\n        BlockWorld->GetRegisteredChunks();\n\n    for (const auto& Pair : RegisteredChunks)\n    {\n        const ACubusVoxelVolumeActor* Chunk =\n            Pair.Value.Get();'''
          registered_replacement = '''    const auto& RegisteredChunks =\n        BlockWorld->GetRegisteredChunks();\n\n    for (const auto& Pair : RegisteredChunks)\n    {\n        const ACubusVoxelVolumeActor* DistancePolicyChunk =\n            Pair.Value.Get();\n\n        if (IsValid(DistancePolicyChunk))\n        {\n            ApplyVegetationDistancePolicy(\n                DistancePolicyChunk->GetVoxelSize()\n            );\n            break;\n        }\n    }\n\n    for (const auto& Pair : RegisteredChunks)\n    {\n        const ACubusVoxelVolumeActor* Chunk =\n            Pair.Value.Get();'''
          # This exact block appears first in RebuildWorldVegetation after streaming origin setup.
          idx = c.find('void ACubusWorldVegetationActor::RebuildWorldVegetation()')
          if idx < 0:
              raise RuntimeError('RebuildWorldVegetation not found')
          before, tail = c[:idx], c[idx:]
          tail = once(tail, registered_anchor, registered_replacement, 'apply policy during rebuild')
          c = before + tail

          old_inner = '''    const double InnerRadiusSquared =\n        FMath::Square(\n            static_cast<double>(\n                FMath::Max(\n                    0.0f,\n                    FarVegetationInnerRadius\n                )\n            )\n        );\n\n    const double OuterRadiusSquared =\n        FMath::Square(\n            static_cast<double>(\n                FMath::Max(\n                    FarVegetationInnerRadius,\n                    FarVegetationEndCullDistance\n                )\n            )\n        );'''
          new_inner = '''    const FCubusVegetationDistancePolicy DistancePolicy =\n        ResolveVegetationDistancePolicy(\n            SafeVoxelSize\n        );\n\n    const double InnerRadiusSquared =\n        FMath::Square(\n            static_cast<double>(\n                DistancePolicy.FarInnerRadius\n            )\n        );\n\n    const double OuterRadiusSquared =\n        FMath::Square(\n            static_cast<double>(\n                FMath::Max(\n                    DistancePolicy.FarInnerRadius,\n                    FarVegetationEndCullDistance\n                )\n            )\n        );'''
          c = once(c, old_inner, new_inner, 'far inner distance policy')

          hash_anchor = '''    Hash = HashCombineFast(Hash, GetTypeHash(MaximumRenderedPlants));\n    Hash = HashCombineFast(Hash, GetTypeHash(bClusterTreeFamilies));'''
          hash_replacement = '''    Hash = HashCombineFast(Hash, GetTypeHash(MaximumRenderedPlants));\n    Hash = HashCombineFast(Hash, GetTypeHash(PlantStartCullDistance));\n    Hash = HashCombineFast(Hash, GetTypeHash(PlantEndCullDistance));\n    Hash = HashCombineFast(Hash, GetTypeHash(bCullByCameraChunkRadius));\n    Hash = HashCombineFast(Hash, GetTypeHash(CameraChunkHorizontalRadius));\n    Hash = HashCombineFast(Hash, GetTypeHash(CameraChunkVerticalRadius));\n    Hash = HashCombineFast(Hash, GetTypeHash(VegetationRecenterDistance));\n    Hash = HashCombineFast(Hash, GetTypeHash(FarVegetationInnerRadius));\n    Hash = HashCombineFast(Hash, GetTypeHash(FarVegetationEndCullDistance));\n    Hash = HashCombineFast(Hash, GetTypeHash(bClusterTreeFamilies));'''
          c = once(c, hash_anchor, hash_replacement, 'distance settings hash')

          cp.write_text(c, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -n "PlantStartCullDistance = 16000" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "PlantEndCullDistance = 22000" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "FarVegetationInnerRadius = 16000.0f" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h
          grep -n "ResolveVegetationDistancePolicy" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "Cubus vegetation distance policy" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          grep -n "DistancePolicy.FarInnerRadius" Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git commit -m "Unify vegetation distance handoff"
          git push origin HEAD:agent/density-meshing
