name: Finish vegetation refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-vegetation-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact vegetation refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          actor_cpp = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp')
          actor_h = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.h')
          renderer_cpp = Path('Source/Orakai/CubusCore/Vegetation/CubusVegetationRenderer.cpp')
          renderer_h = Path('Source/Orakai/CubusCore/Vegetation/CubusVegetationRenderer.h')

          text = actor_cpp.read_text()

          local_anchor = '    TMap<int64, TArray<FTransform>> CatalogTransformsByBatchKey;\n'
          local_insert = local_anchor + '    TMap<int64, TArray<FTransform>> HeroTransformsByBatchKey;\n'
          if local_insert not in text:
              if local_anchor not in text:
                  raise RuntimeError('Actor local transform map anchor not found')
              text = text.replace(local_anchor, local_insert, 1)

          selector_pos = text.index('    FCubusVegetationRepresentationSelector::RouteCandidates(')
          static_start = text.index(
              '    for (const TPair<int64, TObjectPtr<UHierarchicalInstancedStaticMeshComponent>>& Pair',
              selector_pos
          )
          static_end = text.index('\n    int32 ActiveHeroComponentCount = 0;', static_start)

          static_loop = '''    for (const TPair<int64, TObjectPtr<UHierarchicalInstancedStaticMeshComponent>>& Pair
               : CatalogStaticBatchComponents)
          {
              UHierarchicalInstancedStaticMeshComponent* Component =
                  Pair.Value;

              if (!IsValid(Component))
              {
                  continue;
              }

              const TArray<FTransform>* Transforms =
                  CatalogTransformsByBatchKey.Find(Pair.Key);

              if (Transforms == nullptr || Transforms->IsEmpty())
              {
                  continue;
              }

              if (!bForceMegaplantFoliageMaterialOverride)
              {
                  Component->EmptyOverrideMaterials();
              }

              Component->AddInstances(*Transforms, false, false, false);
              Component->BuildTreeIfOutdated(false, false);
              StaticBatchTransformCount += Transforms->Num();
          }
          '''
          text = text[:static_start] + static_loop + text[static_end:]

          fallback_pos = text.index('    int32 RemainingInstancedSkeletalFallbackBudget = 0;')
          skeletal_start = text.index(
              '    for (const TPair<int64, TObjectPtr<UInstancedSkinnedMeshComponent>>& Pair',
              fallback_pos
          )
          skeletal_end = text.index('\n    int32 SignatureLoadedChunkCount = 0;', skeletal_start)

          skeletal_loop = '''    for (const TPair<int64, TObjectPtr<UInstancedSkinnedMeshComponent>>& Pair
               : CatalogSkeletalBatchComponents)
          {
              UInstancedSkinnedMeshComponent* Component = Pair.Value;

              if (!IsValid(Component))
              {
                  continue;
              }

              const TArray<FTransform>* RegularTransforms =
                  CatalogTransformsByBatchKey.Find(Pair.Key);

              const TArray<FTransform>* HeroTransforms =
                  HeroTransformsByBatchKey.Find(Pair.Key);

              const bool bHasRegularTransforms =
                  RegularTransforms != nullptr &&
                  !RegularTransforms->IsEmpty();

              const bool bHasHeroTransforms =
                  HeroTransforms != nullptr &&
                  !HeroTransforms->IsEmpty();

              if (!bHasRegularTransforms && !bHasHeroTransforms)
              {
                  continue;
              }

              const int32 SpeciesIndex =
                  static_cast<int32>(Pair.Key >> 32);

              UMaterialInterface* FoliageOverrideMaterial = nullptr;
              UClass* HeroPveActorClass = nullptr;
              UTransformProviderData* SpeciesTransformProvider = nullptr;

              if (SpeciesCatalog.IsValidIndex(SpeciesIndex))
              {
                  const FCubusVegetationSpeciesCatalogEntry& SpeciesEntry =
                      SpeciesCatalog[SpeciesIndex];

                  if (!IsValid(Component->GetTransformProvider()))
                  {
                      SpeciesTransformProvider =
                          FCubusVegetationAssetResolver::ResolveTransformProvider(
                              SpeciesEntry.SpeciesId
                          );
                  }

                  if (
                      IsValid(SpeciesTransformProvider) &&
                      Component->GetTransformProvider() != SpeciesTransformProvider
                  )
                  {
                      Component->SetTransformProvider(SpeciesTransformProvider);
                      Component->MarkRenderStateDirty();
                      Component->MarkRenderDynamicDataDirty();
                      ++BoundSpeciesTransformProviderCount;
                  }

                  const bool bSpeciesHasNativeDynamicWindProvider =
                      Cast<UDynamicWindData>(
                          Component->GetTransformProvider()
                      ) != nullptr;

                  if (
                      bUseHeroPveActorWindMode &&
                      !bSpeciesHasNativeDynamicWindProvider
                  )
                  {
                      HeroPveActorClass =
                          FCubusVegetationAssetResolver::ResolveHeroPveActorClass(
                              SpeciesEntry
                          );
                  }

                  if (bForceMegaplantFoliageMaterialOverride)
                  {
                      const TSoftObjectPtr<UMaterialInterface> FoliageMaterialRef =
                          FCubusVegetationAssetResolver::ResolveFoliageMaterial(
                              SpeciesEntry.SpeciesId
                          );

                      if (!FoliageMaterialRef.IsNull())
                      {
                          FoliageOverrideMaterial =
                              FoliageMaterialRef.LoadSynchronous();

                          if (IsValid(FoliageOverrideMaterial))
                          {
                              ++FoliageMaterialOverrideComponentCount;
                          }

                          VegetationRenderer.ApplyFoliageMaterialOverride(
                              Component,
                              FoliageOverrideMaterial
                          );
                      }
                  }
              }

              const bool bHasNativeDynamicWindProvider =
                  Cast<UDynamicWindData>(
                      Component->GetTransformProvider()
                  ) != nullptr;

              FCubusHeroVegetationRenderSettings RenderSettings;
              RenderSettings.bUsePveActors = bUseHeroPveActorWindMode;
              RenderSettings.bUseInstancedSkeletalFallback =
                  bUseInstancedSkeletalFallbackBeyondHeroDistance;
              RenderSettings.bForceFoliageMaterialOverride =
                  bForceMegaplantFoliageMaterialOverride;
              RenderSettings.bCastShadow = bCastWorldPlantShadows;
              RenderSettings.bAppendOnly = bAppendOnly;

              if (bHasRegularTransforms)
              {
                  RenderSettings.bEnabled = false;

                  const FCubusHeroVegetationRenderResult RegularResult =
                      VegetationRenderer.RenderSkeletalBatch(
                          this,
                          World,
                          Root,
                          Component,
                          *RegularTransforms,
                          HeroPveActorClass,
                          FoliageOverrideMaterial,
                          CachedUltraDynamicWeatherActor,
                          RenderSettings,
                          ActiveHeroComponentCount,
                          ActiveHeroPveActorCount,
                          RemainingInstancedSkeletalFallbackBudget,
                          HeroSkeletalWindComponents,
                          HeroPveWindActors
                      );

                  SkeletalBatchTransformCount +=
                      RegularResult.SkeletalInstanceCount;

                  InstancedSkeletalFallbackCount +=
                      RegularResult.InstancedFallbackCount;
              }

              if (bHasHeroTransforms)
              {
                  RenderSettings.bEnabled =
                      bEnableHeroSkeletalWindMode &&
                      !bHasNativeDynamicWindProvider;

                  const FCubusHeroVegetationRenderResult HeroResult =
                      VegetationRenderer.RenderSkeletalBatch(
                          this,
                          World,
                          Root,
                          Component,
                          *HeroTransforms,
                          HeroPveActorClass,
                          FoliageOverrideMaterial,
                          CachedUltraDynamicWeatherActor,
                          RenderSettings,
                          ActiveHeroComponentCount,
                          ActiveHeroPveActorCount,
                          RemainingInstancedSkeletalFallbackBudget,
                          HeroSkeletalWindComponents,
                          HeroPveWindActors
                      );

                  SkeletalBatchTransformCount +=
                      HeroResult.SkeletalInstanceCount;

                  InstancedSkeletalFallbackCount +=
                      HeroResult.InstancedFallbackCount;
              }
          }
          '''
          text = text[:skeletal_start] + skeletal_loop + text[skeletal_end:]
          actor_cpp.write_text(text)

          text = actor_h.read_text()
          text = text.replace(
              '    TMap<int64, TArray<FTransform>> HeroTransformsByBatchKey;\n\n',
              '',
              1
          )
          actor_h.write_text(text)

          text = renderer_h.read_text()
          old_settings = '''struct FCubusHeroVegetationRenderSettings
          {
              bool bEnabled = false;
              bool bUsePveActors = false;
              bool bUseInstancedSkeletalFallback = false;
              bool bForceFoliageMaterialOverride = false;
              bool bCastShadow = true;
              bool bHasCamera = false;
              bool bAppendOnly = false;

              int32 MaxHeroComponents = 0;

              float MaxHeroDistance = 0.0f;

              FVector CameraLocation = FVector::ZeroVector;
          };
          '''
          new_settings = '''struct FCubusHeroVegetationRenderSettings
          {
              bool bEnabled = false;
              bool bUsePveActors = false;
              bool bUseInstancedSkeletalFallback = false;
              bool bForceFoliageMaterialOverride = false;
              bool bCastShadow = true;
              bool bAppendOnly = false;
          };
          '''
          if old_settings not in text:
              raise RuntimeError('Renderer settings struct did not match expected text')
          renderer_h.write_text(text.replace(old_settings, new_settings, 1))

          text = renderer_cpp.read_text()
          pattern = re.compile(
              r'''        bool bUseHero =\n'''
              r'''            HeroLimit > 0 &&\n'''
              r'''            InOutActiveHeroComponentCount <\n'''
              r'''                HeroLimit;\n\n'''
              r'''        if \(\n'''
              r'''            bUseHero &&\n'''
              r'''            Settings\.bHasCamera\n'''
              r'''        \)\n'''
              r'''        \{.*?\n'''
              r'''        \}\n''',
              re.DOTALL
          )
          text, count = pattern.subn('        const bool bUseHero = true;\n', text, count=1)
          if count != 1:
              raise RuntimeError(f'Renderer hero-selection block replacements: {count}')
          renderer_cpp.write_text(text)

          workflow = Path('.github/workflows/finish-vegetation-refactor.yml')
          workflow.unlink()

      - name: Commit completed refactor
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Finish vegetation representation routing"
          git push
