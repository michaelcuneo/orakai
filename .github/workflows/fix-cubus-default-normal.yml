name: Fix Cubus default normal asset path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-cubus-default-normal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix default normal path and add explicit errors
        shell: python
        run: |
          from pathlib import Path

          path = Path('Source/Orakai/CubusCore/Editor/CubusMaterialBuilderLibrary.cpp')
          text = path.read_text()

          text = text.replace(
              'TEXT("/Engine/EngineResources/DefaultNormal.DefaultNormal")',
              'TEXT("/Engine/EngineMaterials/DefaultNormal.DefaultNormal")'
          )

          text = text.replace(
              '''    if (!IsValid(Material))
    {
        return nullptr;
    }''',
              '''    if (!IsValid(Material))
    {
        UE_LOG(LogTemp, Error, TEXT("Cubus material builder failed to load or create M_CubusBlockPBR."));
        return nullptr;
    }''',
              1
          )

          text = text.replace(
              '''    if (!IsValid(DefaultColor) || !IsValid(DefaultNormal))
    {
        return nullptr;
    }''',
              '''    if (!IsValid(DefaultColor) || !IsValid(DefaultNormal))
    {
        UE_LOG(
            LogTemp,
            Error,
            TEXT("Cubus material builder missing defaults. Color=%s Normal=%s"),
            IsValid(DefaultColor) ? TEXT("valid") : TEXT("missing"),
            IsValid(DefaultNormal) ? TEXT("valid") : TEXT("missing")
        );
        return nullptr;
    }''',
              1
          )

          path.write_text(text)
          Path('.github/workflows/fix-cubus-default-normal.yml').unlink()

      - name: Commit fix
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Fix Cubus default normal asset path"
          git push
