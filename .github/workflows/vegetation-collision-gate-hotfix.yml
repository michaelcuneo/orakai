name: Vegetation collision gate hotfix

on:
  push:
    branches:
      - agent/density-meshing

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.event.head_commit.message != 'Remove collision dependency from vegetation placement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/density-meshing
          fetch-depth: 0

      - name: Remove collision-only vegetation rejection
        shell: python
        run: |
          from pathlib import Path

          path = Path('Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp')
          text = path.read_text(encoding='utf-8')

          old_gate = '''            if ((bGrassType || bTreeType) && !bFoundTerrainSurface)\n            {\n                continue;\n            }\n\n'''
          if old_gate not in text:
              raise SystemExit('Expected vegetation collision rejection gate was not found')
          text = text.replace(old_gate, '', 1)

          old_decl = '            bool bFoundTerrainSurface = false;\n\n'
          if old_decl not in text:
              raise SystemExit('Expected bFoundTerrainSurface declaration was not found')
          text = text.replace(old_decl, '', 1)

          old_assignment = '                    bFoundTerrainSurface = true;\n'
          if old_assignment not in text:
              raise SystemExit('Expected bFoundTerrainSurface assignment was not found')
          text = text.replace(old_assignment, '', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/Orakai/CubusCore/Actors/CubusWorldVegetationActor.cpp
          git commit -m "Remove collision dependency from vegetation placement"
          git push origin HEAD:agent/density-meshing
